name: Publish benchmark pages

on:
  pull_request:
    paths:
      - 'docs/benchmark/**'
      - 'data/approval-continuity-benchmark-v3-200.json'
      - 'data/approval-continuity-benchmark-v4-enriched-30.json'
      - 'data/approval-continuity-benchmark-v4-materiality-labeling.csv'
      - 'scripts/enrich_benchmark_v4.py'
      - '.github/workflows/publish-benchmark-pages.yml'
      - 'README.md'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - 'docs/benchmark/**'
      - 'data/approval-continuity-benchmark-v3-200.json'
      - 'data/approval-continuity-benchmark-v4-enriched-30.json'
      - 'data/approval-continuity-benchmark-v4-materiality-labeling.csv'
      - 'scripts/enrich_benchmark_v4.py'
      - '.github/workflows/publish-benchmark-pages.yml'
      - 'README.md'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate benchmark dataset and HTML
        run: |
          python - <<'PY'
          import csv
          import json
          import py_compile
          from html.parser import HTMLParser

          class P(HTMLParser):
              pass

          P().feed(open('docs/benchmark/index.html', encoding='utf-8').read())
          v3 = json.load(open('data/approval-continuity-benchmark-v3-200.json', encoding='utf-8'))
          v4 = json.load(open('data/approval-continuity-benchmark-v4-enriched-30.json', encoding='utf-8'))
          labels = list(csv.DictReader(open('data/approval-continuity-benchmark-v4-materiality-labeling.csv', encoding='utf-8')))
          py_compile.compile('scripts/enrich_benchmark_v4.py', doraise=True)

          assert len(v3['cases']) == 200
          assert sum(bool(x['head_changed_after_latest_approval']) for x in v3['cases']) == 30
          assert sum(x['approval']['actor_class'] == 'HUMAN_OR_NONBOT' for x in v3['cases']) == 170
          assert sum(x['approval']['actor_class'] == 'BOT' for x in v3['cases']) == 30

          assert v4['signal_name'] == 'APPROVAL_COMMIT_DIFFERS_FROM_CAPTURED_FINAL_OR_CURRENT_HEAD'
          assert len(v4['changed_cases']) == 30
          assert v4['summary']['different_git_tree'] == 29
          assert v4['summary']['same_git_tree_different_commit_id'] == 1
          assert v4['summary']['direct_descendant_relation'] == 26
          assert v4['summary']['direct_descendant_with_content_change'] == 25
          assert v4['summary']['diverged_history_with_content_change'] == 3
          assert v4['summary']['captured_head_behind_approval_commit'] == 1
          assert v4['summary']['captured_approval_review_current_state_approved'] == 30
          assert len(labels) == 29
          assert all(not row['reviewer_1_label'] and not row['reviewer_2_label'] for row in labels)

          print('BENCHMARK_V3_VALIDATION=PASS')
          print('BENCHMARK_V4_VALIDATION=PASS')
          PY

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
