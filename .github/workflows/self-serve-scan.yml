name: Self-serve public repo scan

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  scan:
    if: contains(github.event.issue.labels.*.name, 'scan-request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded public historical scan
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/scan_requested_repo.py \
            --event "$GITHUB_EVENT_PATH" \
            --json-out scan-result.json \
            --md-out scan-comment.md
      - name: Return result to requester
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file scan-comment.md
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label scan-complete
      - name: Fail closed with bounded message
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > scan-failed.md <<'MD'
          ## DETERMA scan did not run

          The automated scan failed closed. Common reasons are: the authorization checkbox was not present, the URL was not a canonical public GitHub repository URL, the repository is private, or GitHub did not expose the required public review evidence.

          No mutation was performed on the submitted repository.
          MD
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file scan-failed.md
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label scan-failed
